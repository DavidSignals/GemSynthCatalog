<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ikcha · Sonic Gem Chamber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
      --text-3xl: clamp(2.5rem, 1rem + 4vw, 5rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --space-12: 3rem; --space-16: 4rem; --space-20: 5rem;
      --radius-sm: 0.5rem; --radius-md: 0.85rem; --radius-lg: 1.15rem; --radius-xl: 1.75rem; --radius-full: 9999px;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Inter', sans-serif;
      --color-bg: #05060a;
      --color-surface: rgba(255,255,255,0.05);
      --color-surface-2: rgba(255,255,255,0.08);
      --color-border: rgba(255,255,255,0.12);
      --color-text: #f6f3ff;
      --color-text-muted: #c3bddf;
      --color-text-faint: #8f88ad;
      --color-primary: #cbe7ff;
      --color-accent: #e0b8ff;
      --color-gold: #ffd98a;
      --shadow-lg: 0 24px 80px rgba(0,0,0,.48);
      --shadow-md: 0 14px 40px rgba(0,0,0,.38);
      --needle-x: 52%;
      --needle-y: 42%;
      --needle-angle: 0deg;
    }
    * { box-sizing:border-box; }
    html,body {
      margin:0;
      min-height:100%;
      color:var(--color-text);
      font-family:var(--font-body);
      background:
        radial-gradient(circle at 12% 16%, rgba(255,90,150,.10), transparent 22%),
        radial-gradient(circle at 84% 12%, rgba(120,210,255,.10), transparent 26%),
        radial-gradient(circle at 70% 88%, rgba(255,218,138,.07), transparent 18%),
        linear-gradient(180deg, #090a11 0%, #05060a 48%, #040409 100%);
      overflow-x:hidden;
    }
    body::before, body::after {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
    }
    body::before {
      background-image: radial-gradient(rgba(255,255,255,.07) .5px, transparent .8px);
      background-size: 18px 18px;
      opacity:.15;
      mix-blend-mode:soft-light;
    }
    body::after {
      background: radial-gradient(circle at center, transparent 45%, rgba(0,0,0,.35) 100%);
    }
    canvas { display:block; }
    button, input { font:inherit; }
    .shell { position:relative; z-index:1; }
    .hero-shell { display:grid; grid-template-columns: 1.18fr .82fr; min-height:100vh; }

    .stage {
      position:sticky;
      top:0;
      height:100vh;
      border-right:1px solid var(--color-border);
      overflow:hidden;
      z-index:2;
    }
    #scene { width:100%; height:100%; }
    .stage-overlay {
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:var(--space-6);
      pointer-events:none;
    }
    .stage-overlay .topbar,
    .stage-overlay .hero-card {
      pointer-events:auto;
    }
    .topbar, .hero-card {
      backdrop-filter: blur(20px);
      background:linear-gradient(180deg, rgba(10,11,18,.68), rgba(10,11,18,.38));
      border:1px solid var(--color-border);
      box-shadow:var(--shadow-md);
    }
    .topbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:var(--space-3);
      padding:.95rem 1rem;
      border-radius:var(--radius-full);
    }
    .brand { display:flex; align-items:center; gap:var(--space-3); }
    .logo { width:46px; height:46px; color:#f3ebff; }
    .brand-mark { display:flex; flex-direction:column; gap:.1rem; }
    .eyebrow {
      color:var(--color-primary);
      font-size:var(--text-xs);
      text-transform:uppercase;
      letter-spacing:.2em;
    }
    .brand-name { font-family:var(--font-display); font-size:var(--text-xl); line-height:.9; }
    .hero-card {
      align-self:end;
      max-width:46ch;
      padding:var(--space-6);
      border-radius:var(--radius-xl);
    }
    .hero-card h1 {
      margin:0 0 var(--space-4);
      font-family:var(--font-display);
      font-size:var(--text-3xl);
      line-height:.95;
    }
    .hero-card p {
      margin:0 0 var(--space-5);
      color:var(--color-text-muted);
      max-width:40ch;
    }
    .hero-metrics {
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:var(--space-3);
    }
    .hero-metrics div {
      padding:var(--space-3);
      border:1px solid rgba(255,255,255,.08);
      border-radius:var(--radius-lg);
      background:rgba(255,255,255,.04);
    }
    .hero-metrics strong {
      display:block;
      color:var(--color-primary);
      font-size:var(--text-xs);
      text-transform:uppercase;
      letter-spacing:.16em;
      margin-bottom:.45rem;
    }
    .hero-metrics span { font-size:var(--text-sm); color:var(--color-text); }
    .side {
      padding:var(--space-6);
      display:grid;
      gap:var(--space-5);
      align-content:start;
      position:relative;
      z-index:1;
      background:linear-gradient(180deg, rgba(5,6,10,.0), rgba(5,6,10,.55) 6%, rgba(5,6,10,.85) 100%);
    }
    .panel {
      border:1px solid var(--color-border);
      border-radius:var(--radius-xl);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.025));
      backdrop-filter: blur(20px);
      box-shadow:var(--shadow-md);
      padding:var(--space-5);
    }
    .section-label {
      margin:0 0 var(--space-2);
      color:var(--color-primary);
      font-size:var(--text-xs);
      letter-spacing:.16em;
      text-transform:uppercase;
    }
    .panel h2, .panel h3 {
      margin:0 0 var(--space-3);
      font-family:var(--font-display);
      line-height:1;
    }
    .panel h2 { font-size:var(--text-2xl); }
    .panel h3 { font-size:var(--text-xl); }
    .panel p { color:var(--color-text-muted); }
    .chip-row { display:flex; flex-wrap:wrap; gap:var(--space-2); }
    .chip {
      padding:.55rem .82rem;
      border-radius:var(--radius-full);
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.05);
      color:var(--color-text-muted);
      font-size:var(--text-xs);
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .catalog-grid {
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:var(--space-3);
    }

    .gem-card {
      position:relative;
      text-align:left;
      min-height:180px;
      overflow:hidden;
      padding:var(--space-4);
      border-radius:var(--radius-lg);
      border:1px solid rgba(255,255,255,.1);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      cursor:pointer;
      transition:transform .25s ease, border-color .25s ease, background .25s ease;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
    }
    .gem-card::before {
      content:"";
      position:absolute;
      inset:-20% auto auto 65%;
      width:120px;
      height:120px;
      border-radius:50%;
      background:radial-gradient(circle, var(--card-glow), transparent 68%);
      opacity:.55;
      filter:blur(10px);
    }
    .gem-card:hover,
    .gem-card:focus-visible,
    .gem-card.active {
      transform:translateY(-4px);
      border-color:rgba(255,255,255,.24);
      background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    }

    .gem-thumb {
      width:52px;
      height:52px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.2);
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 30% 20%, var(--card-glow), transparent 60%),
        radial-gradient(circle at 70% 80%, rgba(0,0,0,.4), transparent 60%);
      box-shadow:0 0 18px rgba(0,0,0,.55);
      margin-bottom:.7rem;
    }
    .gem-thumb-inner {
      width:34px;
      height:34px;
      border-radius:50%;
      background:
        radial-gradient(circle at 25% 20%, var(--card-color), #000),
        radial-gradient(circle at 70% 80%, rgba(255,255,255,.35), transparent 70%);
      box-shadow:inset 0 0 10px rgba(255,255,255,.4);
      transform:rotate(-16deg);
    }
    .gem-thumb-emerald,
    .gem-thumb-emerald-tall,
    .gem-thumb-cushion,
    .gem-thumb-cushion-green,
    .gem-thumb-cushion-blue {
      border-radius:0.9rem;
    }
    .gem-thumb-pear,
    .gem-thumb-pear-dark {
      width:32px;
      height:40px;
      border-radius:50% 50% 55% 55%;
    }
    .gem-thumb-marquise {
      width:40px;
      height:32px;
      border-radius:50% 50% 50% 50%;
      transform:rotate(-10deg);
    }
    .gem-thumb-round,
    .gem-thumb-round-dark,
    .gem-thumb-round-dual,
    .gem-thumb-round-flat,
    .gem-thumb-round-salt,
    .gem-thumb-round-brilliant {
      border-radius:50%;
    }

    .gem-card .type {
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      font-size:var(--text-xs);
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--color-primary);
    }
    .dot {
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--card-color);
      box-shadow:0 0 18px var(--card-color);
    }
    .gem-card h4 {
      margin:.85rem 0 .35rem;
      font-family:var(--font-display);
      font-size:var(--text-lg);
      color:var(--color-text);
    }
    .gem-card p {
      margin:0 0 1rem;
      font-size:var(--text-sm);
      color:var(--color-text-muted);
    }
    .price {
      display:inline-flex;
      padding:.45rem .68rem;
      border-radius:var(--radius-full);
      background:rgba(255,255,255,.07);
      color:var(--color-gold);
      font-weight:700;
      font-size:var(--text-xs);
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .detail-grid {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:var(--space-4);
    }
    .stat {
      border:1px solid rgba(255,255,255,.08);
      border-radius:var(--radius-lg);
      background:rgba(255,255,255,.03);
      padding:var(--space-4);
    }
    .stat strong {
      display:block;
      color:var(--color-primary);
      font-size:var(--text-xs);
      letter-spacing:.16em;
      text-transform:uppercase;
      margin-bottom:.45rem;
    }
    .stat span { color:var(--color-text); }
    .narrative { line-height:1.75; }

    .scanner {
      position:relative;
      height:240px;
      overflow:hidden;
      border-radius:var(--radius-xl);
      border:1px solid rgba(255,255,255,.12);
      cursor:crosshair;
      touch-action:none;
      background:
        radial-gradient(circle at var(--needle-x) var(--needle-y), rgba(255,255,255,.65), rgba(255,255,255,.12) 7%, rgba(124,232,255,.2) 11%, transparent 18%),
        linear-gradient(135deg, rgba(255,255,255,.12), transparent 30%),
        repeating-linear-gradient(128deg, rgba(255,255,255,.14) 0 2px, transparent 2px 12px),
        linear-gradient(160deg, rgba(124,232,255,.14), rgba(215,166,255,.07) 40%, rgba(255,215,137,.16)),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), rgba(0,0,0,.26));
      box-shadow: inset 0 0 60px rgba(0,0,0,.35), 0 20px 50px rgba(0,0,0,.22);
      transition: filter .05s linear;
    }
    .scanner::before {
      content:"";
      position:absolute;
      left:var(--needle-x);
      top:var(--needle-y);
      width:2px;
      height:250px;
      background:linear-gradient(180deg, rgba(255,255,255,0), rgba(203,231,255,.95), rgba(255,255,255,0));
      transform:translate(-50%, -50%) rotate(var(--needle-angle));
      transform-origin:center 50%;
      filter:drop-shadow(0 0 12px rgba(203,231,255,.8));
    }
    .scanner::after {
      content:"";
      position:absolute;
      left:calc(var(--needle-x) - 18px);
      top:calc(var(--needle-y) - 18px);
      width:36px;
      height:36px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.42);
      box-shadow:0 0 22px rgba(203,231,255,.42), inset 0 0 24px rgba(255,255,255,.28);
    }
    .scanner-hint {
      position:absolute;
      bottom:.6rem;
      right:.8rem;
      font-size:var(--text-xs);
      letter-spacing:.12em;
      text-transform:uppercase;
      color:rgba(255,255,255,.55);
      pointer-events:none;
    }

    .controls { display:flex; flex-wrap:wrap; gap:var(--space-3); }
    .control {
      min-width:44px;
      min-height:44px;
      padding:.9rem 1.1rem;
      border-radius:var(--radius-full);
      border:1px solid var(--color-border);
      background:rgba(255,255,255,.05);
      color:var(--color-text);
      cursor:pointer;
      transition:transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .control:hover { transform:translateY(-2px); }
    .control.primary {
      background:linear-gradient(180deg, rgba(203,231,255,.24), rgba(203,231,255,.08));
    }

    .sound-stage {
      display:grid;
      grid-template-columns: 1fr .8fr;
      gap:var(--space-4);
      align-items:start;
    }
    .mini-meter { display:grid; gap:var(--space-2); }
    .bar {
      position:relative;
      height:10px;
      border-radius:var(--radius-full);
      background:rgba(255,255,255,.08);
      overflow:hidden;
    }
    .bar > span {
      position:absolute;
      inset:0 auto 0 0;
      width:40%;
      border-radius:inherit;
      background:linear-gradient(90deg, rgba(203,231,255,.9), rgba(224,184,255,.9), rgba(255,217,138,.9));
      box-shadow:0 0 18px rgba(203,231,255,.4);
      transition:width .08s linear;
    }
    .legend-row {
      display:flex;
      justify-content:space-between;
      gap:var(--space-3);
      font-size:var(--text-sm);
      color:var(--color-text-muted);
    }

    .vault {
      padding: var(--space-12) var(--space-6) var(--space-16);
      position:relative;
      z-index:1;
      background:rgba(5,6,10,.9);
    }
    .vault-grid {
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:var(--space-4);
    }
    .vault-card {
      min-height:200px;
      padding:var(--space-4);
      border-radius:var(--radius-lg);
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    }
    .vault-card strong {
      display:block;
      font-family:var(--font-display);
      font-size:var(--text-lg);
      margin-bottom:.45rem;
    }
    .vault-card span {
      display:inline-flex;
      margin-bottom:.9rem;
      padding:.42rem .62rem;
      border-radius:var(--radius-full);
      background:rgba(255,255,255,.06);
      color:var(--color-gold);
      font-size:var(--text-xs);
      letter-spacing:.14em;
      text-transform:uppercase;
    }
    .vault-card p { margin:0; font-size:var(--text-sm); color:var(--color-text-muted); }

    .footer-brand {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:var(--space-3);
      flex-wrap:wrap;
      padding-top:var(--space-8);
      color:var(--color-text-muted);
    }
    .footer-left { display:flex; align-items:center; gap:var(--space-3); }
    .footer-brand .mark {
      width:34px;
      height:34px;
      border-radius:50%;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.14);
    }
    .credit {
      margin-left:auto;
      color:var(--color-primary);
      font-size:var(--text-sm);
      letter-spacing:.08em;
    }

    @media (max-width: 1320px) {
      .catalog-grid { grid-template-columns:repeat(2, minmax(0,1fr)); }
      .vault-grid { grid-template-columns:repeat(3, minmax(0,1fr)); }
    }
    @media (max-width: 1120px) {
      .hero-shell { grid-template-columns: 40vw 1fr; }
      .stage { height:100vh; }
      .sound-stage { grid-template-columns:1fr; }
    }
    @media (max-width: 760px) {
      .hero-shell { grid-template-columns:1fr; }
      .stage {
        height:46vh;
        border-right:none;
        border-bottom:1px solid var(--color-border);
      }
      .hero-card { display:none; }
      .side, .vault { padding:var(--space-4); }
      .hero-metrics, .detail-grid, .catalog-grid, .vault-grid { grid-template-columns:1fr; }
      .topbar { border-radius:var(--radius-lg); }
      .credit { margin-left:0; }
    }
  </style>
</head>
<body>
